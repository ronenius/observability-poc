  selector:
    matchLabels:
      app: outbox-forwarder
  template:
    metadata:
      labels:
        app: outbox-forwarder
    spec:
      containers:
      - name: forwarder
        image: noc-python:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/outbox_forwarder.py"]
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres-instance1:5432/postgres"
        - name: GATEWAY_URL
          value: "http://instance2-gateway:8082/api/v1/replicate"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: scripts
          mountPath: /app/outbox_forwarder.py
          subPath: outbox_forwarder.py
      volumes:
      - name: scripts
        configMap:
          name: instance1-scripts
