apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-instance2-init
  namespace: noc-platform
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Mirrored Alerts Table on Secondary Site
    CREATE TABLE IF NOT EXISTS alerts (
        id BIGSERIAL PRIMARY KEY,
        identifier VARCHAR(255) UNIQUE NOT NULL,
        node VARCHAR(255) NOT NULL,
        alert_key VARCHAR(255) NOT NULL,
        severity VARCHAR(32) NOT NULL,
        status VARCHAR(32) NOT NULL DEFAULT 'OPEN',
        summary TEXT NOT NULL,
        tally INT NOT NULL DEFAULT 1,
        version BIGINT NOT NULL DEFAULT 1,
        first_occurrence TIMESTAMPTZ NOT NULL,
        last_occurrence TIMESTAMPTZ NOT NULL,
        last_state_change TIMESTAMPTZ NOT NULL,
        is_flapping BOOLEAN NOT NULL DEFAULT FALSE,
        custom_fields JSONB NOT NULL DEFAULT '{}'::jsonb,
        deleted_at TIMESTAMPTZ NULL,
        replicated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_sec_alerts_active 
    ON alerts (identifier, severity) 
    WHERE status != 'RESOLVED' AND deleted_at IS NULL;

    -- Replication Audit Log
    CREATE TABLE IF NOT EXISTS alerts_replication_log (
        id BIGSERIAL PRIMARY KEY,
        identifier VARCHAR(255) NOT NULL,
        operation VARCHAR(32) NOT NULL,
        version BIGINT NOT NULL,
        severity VARCHAR(32) NOT NULL,
        status VARCHAR(32) NOT NULL,
        received_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-instance2
  namespace: noc-platform
  labels:
    app: postgres-instance2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-instance2
  template:
    metadata:
      labels:
        app: postgres-instance2
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: postgres
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: init-script
        configMap:
          name: postgres-instance2-init
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-instance2
  namespace: noc-platform
spec:
  type: ClusterIP
  selector:
    app: postgres-instance2
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
