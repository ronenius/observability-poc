server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Reverse proxy Holmes API endpoints
    location /api/ {
        proxy_pass http://holmes.holmes.svc.cluster.local:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for real-time investigation responses
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    location /healthz {
        proxy_pass http://holmes.holmes.svc.cluster.local:5050/healthz;
        proxy_http_version 1.1;
    }

    location /readyz {
        proxy_pass http://holmes.holmes.svc.cluster.local:5050/readyz;
        proxy_http_version 1.1;
    }

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
