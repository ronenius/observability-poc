apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend2
  namespace: observability-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend2
  template:
    metadata:
      labels:
        app: backend2
        hec-token: "22222222-2222-2222-2222-222222222222"
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
      - name: backend2
        image: image-registry.openshift-image-registry.svc:5000/observability-poc/backend2:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend2
  namespace: observability-poc
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: backend2