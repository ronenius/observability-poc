apiVersion: v1
kind: Namespace
metadata:
  name: splunk
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: splunk-data
  namespace: splunk
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk
  namespace: splunk
  labels:
    app: splunk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splunk
  template:
    metadata:
      labels:
        app: splunk
    spec:
      initContainers:
      - name: setup-custom-app
        image: splunk/splunk:latest
        imagePullPolicy: IfNotPresent
        command: ['/bin/sh', '-c', 'mkdir -p /app/default && cp -f /config/* /app/default/']
        volumeMounts:
        - name: splunk-custom-config
          mountPath: /config
        - name: splunk-app-observability
          mountPath: /app
      containers:
      - name: splunk
        image: splunk/splunk:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SPLUNK_GENERAL_TERMS
          value: "--accept-sgt-current-at-splunk-com"
        - name: SPLUNK_START_ARGS
          value: "--accept-license"
        - name: SPLUNK_PASSWORD
          value: "Admin@123456"
        - name: SPLUNK_ROLE
          value: "splunk_standalone"
        - name: SPLUNK_HEC_TOKEN
          value: "00000000-0000-0000-0000-000000000000"
        - name: SPLUNK_HEC_ENABLE
          value: "true"
        - name: SPLUNK_HEC_SSL
          value: "false"
        ports:
        - name: web
          containerPort: 8000
        - name: hec
          containerPort: 8088
        - name: s2s
          containerPort: 9997
        - name: mgmt
          containerPort: 8089
        resources:
          requests:
            cpu: "500m"
            memory: "1.5Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
        volumeMounts:
        - name: splunk-storage
          mountPath: /opt/splunk/var
        - name: splunk-app-observability
          mountPath: /opt/splunk/etc/apps/observability
      volumes:
      - name: splunk-storage
        persistentVolumeClaim:
          claimName: splunk-data
      - name: splunk-custom-config
        configMap:
          name: splunk-custom-config
      - name: splunk-app-observability
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: splunk-custom-config
  namespace: splunk
data:
  app.conf: |
    [install]
    is_configured = 1
    state = enabled

    [ui]
    is_visible = 0
    label = Observability Indexes and HEC Tokens

  indexes.conf: |
    [frontend]
    coldPath = $SPLUNK_DB/frontend/colddb
    homePath = $SPLUNK_DB/frontend/db
    thawedPath = $SPLUNK_DB/frontend/thaweddb

    [backend]
    coldPath = $SPLUNK_DB/backend/colddb
    homePath = $SPLUNK_DB/backend/db
    thawedPath = $SPLUNK_DB/backend/thaweddb

  inputs.conf: |
    [http]
    disabled = 0
    enableSSL = 0

    [http://splunk_hec_token]
    disabled = 0
    token = 00000000-0000-0000-0000-000000000000

    [http://frontend_hec]
    disabled = 0
    index = frontend
    indexes = frontend
    token = 11111111-1111-1111-1111-111111111111

    [http://backend_hec]
    disabled = 0
    index = backend
    indexes = backend
    token = 22222222-2222-2222-2222-222222222222

  props.conf: |
    [httpevent]
    TRANSFORMS-extract_payload_time = extract_payload_time

    [source::alloy]
    TRANSFORMS-extract_payload_time = extract_payload_time

  transforms.conf: |
    [extract_payload_time]
    INGEST_EVAL = _time = coalesce(strptime(_raw, "%Y-%m-%d %H:%M:%S,%3N"), strptime(replace(_raw, ".*\"(?:@timestamp|timestamp)\":\s*\"([^\"]+)\".*", "\1"), "%Y-%m-%dT%H:%M:%S.%3N%Z"), strptime(replace(_raw, ".*\"(?:@timestamp|timestamp)\":\s*\"([^\"]+)\".*", "\1"), "%Y-%m-%dT%H:%M:%S.%6N%Z"), strptime(replace(_raw, ".*\"(?:@timestamp|timestamp)\":\s*\"([^\"]+)\".*", "\1"), "%Y-%m-%dT%H:%M:%S%Z"), _time)
---
apiVersion: v1
kind: Service
metadata:
  name: splunk
  namespace: splunk
spec:
  type: ClusterIP
  selector:
    app: splunk
  ports:
  - name: web
    port: 8000
    targetPort: 8000
  - name: hec
    port: 8088
    targetPort: 8088
  - name: s2s
    port: 9997
    targetPort: 9997
  - name: mgmt
    port: 8089
    targetPort: 8089
