apiVersion: v1
kind: Secret
metadata:
  name: holmes-secrets
  namespace: holmes
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-placeholder"
  GEMINI_API_KEY: "your-gemini-api-key-here"
  GRAFANA_USER: "admin"
  GRAFANA_PASSWORD: "your-grafana-password"
  SPLUNK_USER: "admin"
  SPLUNK_PASSWORD: "your-splunk-password"

  # Airgapped / Local OSS Models (vLLM, Ollama, LiteLLM Proxy, etc.)
  GEMMA_API_KEY: "your-gemma-api-key-or-dummy"
  GEMMA_API_BASE: "http://llm-service.local:8000/v1"

  QWEN_API_KEY: "your-qwen-api-key-or-dummy"
  QWEN_API_BASE: "http://llm-service.local:8000/v1"

  GPT_OSS_API_KEY: "your-gpt-oss-api-key-or-dummy"
  GPT_OSS_API_BASE: "http://llm-service.local:8000/v1"
