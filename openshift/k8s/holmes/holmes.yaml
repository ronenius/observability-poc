apiVersion: v1
kind: Namespace
metadata:
  name: holmes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: holmes
  namespace: holmes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: holmes-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
      - events
      - namespaces
      - nodes
      - resourcequotas
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.openshift.io"]
    resources:
      - deploymentconfigs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagers
      - prometheuses
      - servicemonitors
      - podmonitors
      - prometheusrules
      - scrapeconfigs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: holmes-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: holmes-cluster-role
subjects:
  - kind: ServiceAccount
    name: holmes
    namespace: holmes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: holmes-cluster-monitoring-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: holmes
    namespace: holmes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: holmes-config
  namespace: holmes
data:
  config.yaml: |
    model: "gemini/gemini-3.6-flash"
    alertmanager_url: "http://prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093"
    toolsets:
      kubernetes/core:
        enabled: true
      prometheus/metrics:
        enabled: true
        subtype: "prometheus"
        config:
          prometheus_url: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
      grafana/dashboards:
        enabled: true
        config:
          api_url: "http://prometheus-stack-grafana.monitoring.svc.cluster.local:80"
          username: "admin"
          password: "9oCV8ish5xVlGx1Kl4K8kTn3CJIb34QGad2B6Dc3"
      grafana/loki:
        enabled: true
        config:
          api_url: "http://loki-gateway.monitoring.svc.cluster.local"
          additional_headers:
            X-Scope-OrgID: "demo_app"
      grafana/tempo:
        enabled: true
        config:
          api_url: "http://tempo.monitoring.svc.cluster.local:3200"
          additional_headers:
            X-Scope-OrgID: "demo_app"
    custom_toolsets:
      - "/var/holmes/config/splunk_toolset.yaml"

  model_list.yaml: |
    gemini/gemini-3-flash:
      model: "gemini/gemini-3-flash-preview"
    gemini/gemini-3-flash-preview:
      model: "gemini/gemini-3-flash-preview"
    gemini/gemini-3.5-flash-lite:
      model: "gemini/gemini-3.5-flash-lite"
    gemini/gemini-3.6-flash:
      model: "gemini/gemini-3.6-flash"
    gemini/gemini-3.7-flash:
      model: "gemini/gemini-3.7-flash"
    gemini/gemini-3.8-flash:
      model: "gemini/gemini-3.8-flash"
    gemma-4:
      model: "openai/gemma-4"
    gemma/gemma-4:
      model: "openai/gemma-4"
    qwen-3.8:
      model: "openai/qwen-3.8"
    qwen/qwen-3.8:
      model: "openai/qwen-3.8"
    gpt-oss:
      model: "openai/gpt-oss"
    openai/gpt-oss:
      model: "openai/gpt-oss"

  splunk_search.py: |
    #!/usr/bin/env python3
    import sys, os, urllib.request, urllib.parse, urllib.error, ssl, base64, json

    raw_query = sys.argv[1].strip() if len(sys.argv) > 1 else ""
    earliest = sys.argv[2] if len(sys.argv) > 2 else "-1h"
    latest = sys.argv[3] if len(sys.argv) > 3 else "now"

    while (raw_query.startswith("\x27") and raw_query.endswith("\x27")) or (raw_query.startswith("\"") and raw_query.endswith("\"")):
        raw_query = raw_query[1:-1].strip()

    if raw_query.lower().startswith("search "):
        raw_query = raw_query[7:].strip()

    if "index=" not in raw_query and not raw_query.startswith("|"):
        raw_query = f"index=* ({raw_query})" if raw_query else "index=*"

    if "|" not in raw_query:
        raw_query = f"{raw_query} | head 50"

    search_prefix = "" if raw_query.startswith("|") else "search "
    final_query = f"{search_prefix}{raw_query}"

    user = os.environ.get("SPLUNK_USER", "admin")
    password = os.environ.get("SPLUNK_PASSWORD", "Admin@123456")
    url = "https://splunk.splunk.svc.cluster.local:8089/services/search/jobs/export"

    data = urllib.parse.urlencode({
        "search": final_query,
        "output_mode": "json",
        "earliest_time": earliest,
        "latest_time": latest
    }).encode("utf-8")

    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE

    req = urllib.request.Request(url, data=data)
    auth = base64.b64encode(f"{user}:{password}".encode()).decode()
    req.add_header("Authorization", f"Basic {auth}")

    try:
        with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
            raw_output = resp.read().decode("utf-8", errors="replace").strip()
            lines = raw_output.splitlines()
            results = []
            for line in lines:
                try:
                    obj = json.loads(line)
                    if not obj.get("preview", False) and "result" in obj:
                        results.append(obj["result"])
                except:
                    pass
            if results:
                print(json.dumps(results, indent=2))
            elif lines:
                print(raw_output)
            else:
                print("No events found.")
    except urllib.error.HTTPError as e:
        err_body = e.read().decode("utf-8", errors="replace")
        print(f"Splunk API HTTP Error {e.code}: {err_body}")
    except Exception as e:
        print(f"Error querying Splunk: {e}")

  splunk_toolset.yaml: |
    toolsets:
      splunk:
        description: "Search and retrieve logs from Splunk Enterprise using SPL queries"
        prerequisites:
          - command: "python3 --version"
        tags:
          - core
        tools:
          - name: splunk_search
            description: "Execute a Splunk SPL search query and return matching log events in JSON format. Application logs are stored in 'frontend', 'backend1', and 'backend2' indices. Example: 'index=* | stats count' or 'index=* error | head 50'."
            parameters:
              splunk_query:
                type: string
                description: "The Splunk search SPL query. Examples: 'index=* | stats count', 'index=backend* error | head 20', 'index=* | stats count by index'"
                required: true
              earliest:
                type: string
                description: "Earliest time for search (e.g. '-15m', '-1h', '-24h'). Defaults to '-1h'."
                required: false
              latest:
                type: string
                description: "Latest time for search (e.g. 'now'). Defaults to 'now'."
                required: false
            command: |
              python3 /var/holmes/config/splunk_search.py "{{ splunk_query }}" "{{ earliest | default('-1h') }}" "{{ latest | default('now') }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes
  namespace: holmes
  labels:
    app: holmes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes
  template:
    metadata:
      labels:
        app: holmes
    spec:
      enableServiceLinks: false
      serviceAccountName: holmes
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: holmes
          image: image-registry.openshift-image-registry.svc:5000/holmes/holmes:latest
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              python3 -c 'import os; p1="/app/holmes/config.py"; f1=open(p1,"r"); s1=f1.read(); f1.close(); s1=s1.replace("api_key = api_key.get_secret_value()", "api_key = api_key.get_secret_value() if hasattr(api_key, \"get_secret_value\") else api_key"); f1=open(p1,"w"); f1.write(s1); f1.close(); p2="/app/holmes/core/llm.py"; f2=open(p2,"r"); s2=f2.read(); f2.close(); rep1="        for _name, _entry in llms.items():\n            _l = _name.lower()\n            _ek = os.environ.get(\"GEMMA_API_KEY\") if \"gemma\" in _l else os.environ.get(\"QWEN_API_KEY\") if \"qwen\" in _l else os.environ.get(\"GPT_OSS_API_KEY\") if (\"gpt-oss\" in _l or \"gpt_oss\" in _l) else None\n            _eb = os.environ.get(\"GEMMA_API_BASE\") if \"gemma\" in _l else os.environ.get(\"QWEN_API_BASE\") if \"qwen\" in _l else os.environ.get(\"GPT_OSS_API_BASE\") if (\"gpt-oss\" in _l or \"gpt_oss\" in _l) else None\n            if _ek:\n                from pydantic import SecretStr\n                _entry.api_key = SecretStr(_ek)\n            if _eb: _entry.api_base = _eb; _entry.base_url = _eb\n        return llms"; rep2="            _low = model_key.lower()\n            _k = os.environ.get(\"GEMMA_API_KEY\") if \"gemma\" in _low else os.environ.get(\"QWEN_API_KEY\") if \"qwen\" in _low else os.environ.get(\"GPT_OSS_API_KEY\") if (\"gpt-oss\" in _low or \"gpt_oss\" in _low) else self.config.api_key\n            _b = os.environ.get(\"GEMMA_API_BASE\") if \"gemma\" in _low else os.environ.get(\"QWEN_API_BASE\") if \"qwen\" in _low else os.environ.get(\"GPT_OSS_API_BASE\") if (\"gpt-oss\" in _low or \"gpt_oss\" in _low) else self.config.api_base\n            _tm = \"gemini/gemini-3-flash-preview\" if model_key == \"gemini/gemini-3-flash\" else (\"openai/gemma-4\" if \"gemma\" in _low else \"openai/qwen-3.8\" if \"qwen\" in _low else \"openai/gpt-oss\" if (\"gpt-oss\" in _low or \"gpt_oss\" in _low) else model_key if \"/\" in model_key else None)\n            if _tm:\n                from pydantic import SecretStr\n                _sec_k = SecretStr(_k) if (_k and isinstance(_k, str)) else _k\n                entry = self._create_model_entry(model=_tm, model_name=model_key, base_url=_b, is_robusta_model=False, api_key=_sec_k, api_base=_b, api_version=self.config.api_version)\n                with self._lock: self._llms[model_key] = entry\n                return entry\n            logging.error(f\"Couldn\x27t find model: {model_key} in model list\")"; s2=s2.replace("        return llms", rep1); s2=s2.replace("logging.error(f\"Couldn\x27t find model: {model_key} in model list\")", rep2.strip()); f2=open(p2,"w"); f2.write(s2); f2.close()' && mkdir -p /var/holmes/config && cp -L /etc/holmes/config-ro/* /var/holmes/config/ && exec python3 -u server.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5050
          env:
            - name: HOLMES_PORT
              value: "5050"
            - name: IS_OPENSHIFT
              value: "True"
            - name: HOLMES_CONFIGPATH_DIR
              value: "/var/holmes/config"
            - name: OVERRIDE_MAX_CONTENT_SIZE
              value: "150000"
            - name: OVERRIDE_MAX_OUTPUT_TOKEN
              value: "4096"
            - name: TOOL_MAX_ALLOCATED_CONTEXT_WINDOW_TOKENS
              value: "10000"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: GEMMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GEMMA_API_KEY
                  optional: true
            - name: GEMMA_API_BASE
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GEMMA_API_BASE
                  optional: true
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: QWEN_API_KEY
                  optional: true
            - name: QWEN_API_BASE
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: QWEN_API_BASE
                  optional: true
            - name: GPT_OSS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GPT_OSS_API_KEY
                  optional: true
            - name: GPT_OSS_API_BASE
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GPT_OSS_API_BASE
                  optional: true
            - name: SPLUNK_USER
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: SPLUNK_USER
                  optional: true
            - name: SPLUNK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: SPLUNK_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config-ro-volume
              mountPath: /etc/holmes/config-ro
              readOnly: true
            - name: runtime-volume
              mountPath: /var/holmes
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: config-ro-volume
          configMap:
            name: holmes-config
        - name: runtime-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: holmes
  namespace: holmes
  labels:
    app: holmes
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5050
      targetPort: 5050
      protocol: TCP
  selector:
    app: holmes
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: holmes
  namespace: holmes
  labels:
    app: holmes
spec:
  to:
    kind: Service
    name: holmes
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
