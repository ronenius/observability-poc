apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-ui
  namespace: holmes
  labels:
    app: holmes-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-ui
  template:
    metadata:
      labels:
        app: holmes-ui
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: holmes-ui
          image: your-registry/holmes-ui:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOLMES_BACKEND_URL
              value: "http://holmes.holmes.svc.cluster.local:5050"
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-ui
  namespace: holmes
  labels:
    app: holmes-ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: holmes-ui
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: holmes-ui
  namespace: holmes
  labels:
    app: holmes-ui
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  to:
    kind: Service
    name: holmes-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
