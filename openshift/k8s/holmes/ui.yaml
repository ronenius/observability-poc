apiVersion: v1
kind: ConfigMap
metadata:
  name: holmes-ui-nginx
  namespace: holmes
  labels:
    app: holmes-ui
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_min_length 256;

        # Reverse proxy Holmes API endpoints
        location /api/ {
            proxy_pass http://holmes.holmes.svc.cluster.local:5050/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for real-time investigation responses
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
        }

        location /healthz {
            proxy_pass http://holmes.holmes.svc.cluster.local:5050/healthz;
            proxy_http_version 1.1;
        }

        location /readyz {
            proxy_pass http://holmes.holmes.svc.cluster.local:5050/readyz;
            proxy_http_version 1.1;
        }

        # Static assets
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-ui
  namespace: holmes
  labels:
    app: holmes-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-ui
  template:
    metadata:
      labels:
        app: holmes-ui
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: holmes-ui
          image: your-registry/holmes-ui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /var/cache/nginx
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: nginx-conf
          configMap:
            name: holmes-ui-nginx
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-ui
  namespace: holmes
  labels:
    app: holmes-ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: holmes-ui
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: holmes-ui
  namespace: holmes
  labels:
    app: holmes-ui
spec:
  to:
    kind: Service
    name: holmes-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
