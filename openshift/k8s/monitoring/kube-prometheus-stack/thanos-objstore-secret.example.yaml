apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore-config
  namespace: monitoring
type: Opaque
stringData:
  objstore.yml: |
    # On-Prem S3-compatible Object Storage for Air-Gapped OpenShift (ODF Ceph / MinIO)
    type: S3
    config:
      bucket: "thanos-metrics"
      endpoint: "minio.monitoring.svc.cluster.local:9000"  # Or ODF S3 route/endpoint
      insecure: true
      access_key: "YOUR_ACCESS_KEY"
      secret_key: "YOUR_SECRET_KEY"
      signature_version2: false
