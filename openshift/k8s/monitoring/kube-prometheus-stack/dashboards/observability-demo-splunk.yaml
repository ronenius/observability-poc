                "type": "tempo",
                "uid": "aftjorvtpr20wc"
              },
              "filters": [
                {
                  "id": "efb97f40",
                  "operator": "=",
                  "scope": "span"
                },
                {
                  "id": "service-name",
                  "isCustomValue": false,
                  "operator": "=",
                  "scope": "resource",
                  "tag": "service.name",
                  "value": [],
                  "valueType": "string"
                },
                {
                  "id": "duration-type",
                  "value": "span"
                }
