                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": 0
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Trace ID"
                },
                "properties": [
                  {
                    "id": "links"
                  },
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "View Waterfall",
                        "url": "/d/${__dashboard.uid}?var-traceId=${__data.fields.traceID}"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 9,
            "w": 21,
            "x": 3,
            "y": 0
          },
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": []
          },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "aftjorvtpr20wc"
              },
              "filters": [
                {
                  "id": "c264666a",
                  "operator": "=",
                  "scope": "span"
                },
                {
                  "id": "status",
                  "isCustomValue": false,
                  "operator": "=",
                  "scope": "intrinsic",
                  "tag": "status",
                  "value": "$TraceFilter",
                  "valueType": "keyword"
                },
                {
                  "id": "service-name",
                  "isCustomValue": false,
                  "operator": "=",
                  "scope": "resource",
                  "tag": "service.name",
                  "value": [],
                  "valueType": "string"
                }
              ],
              "limit": 100,
              "metricsQueryType": "range",
              "query": "{} | select(status, resource.service.name)",
              "queryType": "traceqlSearch",
              "refId": "A",
              "serviceMapUseNativeHistograms": false,
              "spss": 100,
              "tableType": "traces"
            }
          ],
          "title": "Traces",
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "delimiter": ",",
                "format": "regexp",
                "keepTime": false,
                "replace": false,
                "source": "traceIdHidden"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "status": false
                },
                "includeByName": {},
                "indexByName": {
                  "Duration": 9,
                  "Name": 6,
                  "NewField": 0,
                  "Span ID": 4,
                  "Start time": 5,
                  "Trace Name": 3,
                  "Trace Service": 2,
                  "service.name": 7,
                  "status": 8,
                  "traceIdHidden": 1
                },
                "renameByName": {
                  "NewField": "Trace ID"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "essinghigh-splunk-datasource",
            "uid": "splunk-datasource"
          },
          "description": "If specific trace selected, shows only logs related to this trace",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "service_name"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 180
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Line"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 600
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "severity_text"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "trace_id"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 260
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 2,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Time"
              }
            ]
          },
          "pluginVersion": "12.4.0",
          "targets": [
            {
              "datasource": {
                "type": "essinghigh-splunk-datasource",
                "uid": "splunk-datasource"
              },
              "queryText": "| search index=* source=alloy NOT \"logger=\" NOT \"component=\" NOT \"caller=\" NOT \"Body: Str(\" \n| rex field=_raw \"(?:\\\"trace_id\\\":\\s*\\\"|trace_?id=)(?<trace_id>[a-fA-F0-9]+)\" \n| where match(trace_id, \"(?i)$traceId\") \n| rex field=_raw \"(?:\\\"level\\\":\\s*\\\"|\\\"log\\.level\\\":\\s*\\\"|\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}:\\d{2},\\d+\\s+)(?<severity_text>[a-zA-Z]+)\" \n| rex field=_raw \"\\\"message\\\":\\s*\\\"(?<msg_json>[^\\\"]+)\\\"\" \n| rex field=_raw \"\\]\\s*-\\s*(?<msg_text>.*)\" \n| rex field=_raw \"(?:resource\\.service\\.name=(?<service_res>[^\\s\\]]+)|\\[(?<service_brack>backend[12]|frontend)\\])\" \n| eval service_name=coalesce(service_res, service_brack, if(match(_raw, \"(?i)frontend\"), \"frontend\", if(match(_raw, \"(?i)backend.?2\"), \"backend2\", if(match(_raw, \"(?i)backend.?1\"), \"backend1\", null())))) \n| eval Line=coalesce(msg_json, msg_text, _raw) \n| eval severity_text=upper(coalesce(severity_text, \"INFO\")) \n| eval service_name=coalesce(service_name, \"unknown\") \n| search service_name!=\"unknown\" \n| table _time, service_name, severity_text, Line, trace_id",
              "refId": "A"
            }
          ],
          "title": "Logs",
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "Time",
                    "_time",
                    "service_name",
                    "severity_text",
                    "Line",
                    "trace_id"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "includeByName": {},
                "indexByName": {
                  "Line": 3,
                  "Time": 0,
                  "_time": 0,
                  "service_name": 1,
                  "severity_text": 2,
                  "trace_id": 4
                },
                "renameByName": {
                  "_time": "Time"
                }
              }
            },
            {
              "id": "formatString",
              "options": {
                "outputFormat": "Upper Case",
                "stringField": "severity_text"
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "tempo",
            "uid": "aftjorvtpr20wc"
          },
          "description": "A trace has to be selected from the traces table to show here",
          "gridPos": {
            "h": 24,
            "w": 24,
            "x": 0,
            "y": 21
