              "metricsQueryType": "range",
              "query": "${traceId}",
              "queryType": "traceql",
              "refId": "A",
              "serviceMapUseNativeHistograms": false,
              "tableType": "traces"
            }
          ],
          "title": "View Waterfall of Trace",
          "type": "traces"
        },
