            },
            "content": "<a href=\"/d/observability-splunk/observability-demo-splunk?orgId=1&from=now-15m&to=now&timezone=browser&var-Filters=&var-traceId=.%2A&refresh=5s\" class=\"btn btn-secondary\">Reset Dashboard</a>\n",
            "mode": "html"
          },
          "pluginVersion": "12.4.0",
          "title": "Reset",
          "type": "text"
        },
        {
          "datasource": {
            "type": "tempo",
            "uid": "aftjorvtpr20wc"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "transparent",
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
