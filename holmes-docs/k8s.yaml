apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmesgpt-docs
  labels:
    app.kubernetes.io/name: holmesgpt-docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: holmesgpt-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: holmesgpt-docs
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: your-registry/holmes-docs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            # Writable ephemeral storage required for readOnlyRootFilesystem
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /var/cache/nginx
            - name: run-volume
              mountPath: /var/run
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        - name: run-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: holmesgpt-docs
  labels:
    app.kubernetes.io/name: holmesgpt-docs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: holmesgpt-docs

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: holmesgpt-docs
  labels:
    app.kubernetes.io/name: holmesgpt-docs
spec:
  to:
    kind: Service
    name: holmesgpt-docs
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect