apiVersion: v1
kind: ConfigMap
metadata:
  name: splunk-hec-router-script
  namespace: monitoring
data:
  router.py: |
    import http.server
    import json
    import gzip
    import urllib.request
    import urllib.error
    import logging
    import os

    logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')

    SPLUNK_HEC_URL = os.environ.get("SPLUNK_HEC_URL", "http://splunk.splunk.svc.cluster.local:8088/services/collector")

    class HECRouterHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            logging.info("%s - %s", self.address_string(), format % args)

        def do_GET(self):
            if self.path in ('/healthz', '/ready'):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            content_length = int(self.headers.get('Content-Length', 0))
            raw_body = self.rfile.read(content_length)

            is_gzipped = self.headers.get('Content-Encoding') == 'gzip' or raw_body[:2] == b'\x1f\x8b'
            if is_gzipped:
                try:
                    body_bytes = gzip.decompress(raw_body)
                except Exception as e:
                    self.send_response(400)
                    self.end_headers()
                    self.wfile.write(f"Decompression error: {e}".encode('utf-8'))
                    return
            else:
                body_bytes = raw_body

            decoder = json.JSONDecoder()
            s = body_bytes.decode('utf-8', errors='replace')
            pos = 0
            events_by_token = {}
            total_events = 0

            while pos < len(s):
                while pos < len(s) and s[pos].isspace():
                    pos += 1
                if pos >= len(s):
                    break
                try:
                    obj, idx = decoder.raw_decode(s[pos:])
                    token = obj.get("fields", {}).get("hec_token")
                    if token:
                        events_by_token.setdefault(token, []).append(obj)
                        total_events += 1
                    pos += idx
                except json.JSONDecodeError as e:
                    logging.error(f"JSON decode error at pos {pos}: {e}")
                    break

            if not events_by_token:
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"text":"Success","code":0,"events":0}')
                return

            for token, events in events_by_token.items():
                payload = "\n".join(json.dumps(ev) for ev in events).encode('utf-8')
                req = urllib.request.Request(
                    SPLUNK_HEC_URL,
                    data=payload,
                    headers={
                        'Authorization': f'Splunk {token}',
                        'Content-Type': 'application/json'
                    },
                    method='POST'
                )
                try:
                    with urllib.request.urlopen(req, timeout=10) as resp:
                        if resp.status != 200:
                            logging.error(f"Splunk returned non-200 status {resp.status} for token {token[:8]}...")
                            self.send_response(503)
                            self.end_headers()
                            self.wfile.write(b'{"error":"Splunk upstream non-200 response"}')
                            return
                except Exception as e:
                    logging.error(f"Upstream Splunk failure for token {token[:8]}...: {e}")
                    self.send_response(503)
                    self.end_headers()
                    self.wfile.write(f'{{"error":"Splunk upstream failure: {e}"}}'.encode('utf-8'))
                    return

            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(f'{{"text":"Success","code":0,"events":{total_events}}}'.encode('utf-8'))

    def run(port=8088):
        server_address = ('', port)
        httpd = http.server.ThreadingHTTPServer(server_address, HECRouterHandler)
        logging.info(f"Starting Synchronous Pass-Through HEC Router on port {port} -> forwarding to {SPLUNK_HEC_URL}")
        httpd.serve_forever()

    if __name__ == '__main__':
        run()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk-hec-router
  namespace: monitoring
  labels:
    app: splunk-hec-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splunk-hec-router
  template:
    metadata:
      labels:
        app: splunk-hec-router
    spec:
      containers:
      - name: router
        image: python:3.11-alpine
        imagePullPolicy: IfNotPresent
        command: ["python3", "-u", "/app/router.py"]
        ports:
        - name: hec
          containerPort: 8088
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8088
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: splunk-hec-router-script
---
apiVersion: v1
kind: Service
metadata:
  name: splunk-hec-router
  namespace: monitoring
  labels:
    app: splunk-hec-router
spec:
  type: ClusterIP
  ports:
  - name: hec
    port: 8088
    targetPort: 8088
  selector:
    app: splunk-hec-router
