apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-loki-tempo
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: kube-prometheus-stack
data:
  loki-tempo-datasources.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: afs6nbwsm6n0gf
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        jsonData:
          maxLines: 1500

      - name: Tempo
        type: tempo
        uid: aftjorvtpr20wc
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
          tracesToLogsV2:
            datasourceUid: afs6nbwsm6n0gf
            spanStartTimeShift: "-2m"
            spanEndTimeShift: "2m"
            tags: ["app", "container", "pod", "service.name"]
            filterBySpanID: false
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-2m"
            spanEndTimeShift: "2m"
            queries:
              - name: "App Request Rate"
                query: 'sum(rate(app_requests_total[1m]))'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: afs6nbwsm6n0gf
        secureJsonData:
          httpHeaderValue1: "demo_app"
