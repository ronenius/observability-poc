apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-loki-tempo
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: kube-prometheus-stack
data:
  loki-tempo-datasources.yaml: |-
    apiVersion: 1

    deleteDatasources:
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1

    datasources:
      # Unified Multi-Tenant Loki DataSource
      - name: loki
        type: loki
        uid: afs6nbwsm6n0gf
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        jsonData:
          maxLines: 1500
          derivedFields:
            - matcherRegex: 'trace_id=([a-fA-F0-9]+)'
              matcherType: regex
              name: backend_trace_id
              url: '$${__value.raw}'
              datasourceUid: aftjorvtpr20wc
            - matcherRegex: 'span_id=([a-fA-F0-9]+)'
              matcherType: regex
              name: backend_span_id
            - matcherRegex: '^\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}(?:,\d{3})?\s(?:\[[^\]]+\]\s)?([A-Z]+)'
              matcherType: regex
              name: backend_severity

      # Unified Multi-Tenant Tempo DataSource (X-Scope-OrgID: demo_app)
      - name: tempo-demo-app
        type: tempo
        uid: aftjorvtpr20wc
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
          tracesToLogsV2:
            datasourceUid: afs6nbwsm6n0gf
            spanStartTimeShift: "-2m"
            spanEndTimeShift: "2m"
            tags: ["app", "container", "pod", "service.name"]
            filterBySpanID: false
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-2m"
            spanEndTimeShift: "2m"
            queries:
              - name: "App Request Rate"
                query: 'sum(rate(app_requests_total[1m]))'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: afs6nbwsm6n0gf
        secureJsonData:
          httpHeaderValue1: "demo_app"
