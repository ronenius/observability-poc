---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-alloy-logs
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "nodes/proxy"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-alloy-logs
subjects:
- kind: ServiceAccount
  name: grafana-alloy
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |-
    // 1. Discover all pods on the local node
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // 2. Map Kubernetes metadata, construct file paths, and define Loki tenant routing
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // Early drop of infrastructure namespaces to minimize file handles and memory
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "^(kube-system|cert-manager|monitoring|opentelemetry-operator-system|splunk)$"
        action        = "drop"
      }

      // Early drop of pods without an 'app' label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "^$"
        action        = "drop"
      }

      // Standard label mapping
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "job"
      }
      
      // MULTI-TENANCY: Extract the 'app' label from pod metadata
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      // SPLUNK HEC ROUTING: Extract the 'hec-token' label from pod metadata
      rule {
        source_labels = ["__meta_kubernetes_pod_label_hec_token"]
        target_label  = "hec_token"
      }

      // Construct the physical file path from the pod UID
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    // 3. Match the discovered paths on the disk
    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    // 4. Tail the files and pass to processing
    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    // 5. Unwrap container runtime JSON/CRI format (extracts pure log line, removing stream & time JSON wrapper)
    loki.process "pod_logs" {
      forward_to = [
        loki.relabel.loki_filter.receiver,
        loki.relabel.splunk_filter.receiver,
      ]

      stage.cri {}
      stage.docker {}

      // Dynamically assign tenant ID (X-Scope-OrgID) from the 'app' label
      stage.tenant {
        label = "app"
      }
    }

    // 6. Loki Filter: Drop logs from pods without an 'app' label
    loki.relabel "loki_filter" {
      forward_to = [loki.write.default.receiver]

      rule {
        source_labels = ["app"]
        regex         = "^$"
        action        = "drop"
      }
    }

    // 7. Output to Loki
    loki.write "default" {
      endpoint {
        // The __tenant_id__ label automatically populates the X-Scope-OrgID header here
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    // 7. Splunk HEC Router: Drop logs from pods without a hec_token label
    loki.relabel "splunk_filter" {
      forward_to = [otelcol.receiver.loki.to_splunk.receiver]

      rule {
        source_labels = ["hec_token"]
        regex         = "^$"
        action        = "drop"
      }
    }

    // 8. Bridge surviving logs into OpenTelemetry pipeline
    otelcol.receiver.loki "to_splunk" {
      output {
        logs = [otelcol.processor.batch.to_splunk.input]
      }
    }

    otelcol.processor.batch "to_splunk" {
      timeout         = "1s"
      send_batch_size = 500
      output {
        logs = [otelcol.exporter.splunkhec.router.input]
      }
    }

    // 9. Single, static Splunk exporter pointing to the Synchronous Pass-Through Router
    otelcol.exporter.splunkhec "router" {
      client {
        endpoint = "http://splunk-hec-router.monitoring.svc.cluster.local:8088/services/collector"
      }
      splunk {
        token  = "dynamic"
        source = "alloy"
      }
      sending_queue {
        enabled       = true
        queue_size    = 200
        num_consumers = 2
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      name: grafana-alloy
  template:
    metadata:
      labels:
        name: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      containers:
      - name: alloy
        image: grafana/alloy:latest
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy
        - --server.http.listen-addr=0.0.0.0:12345
        - --feature.community-components.enabled
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 12345
          name: http-metrics
        
        # Lab-scaled resource limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            
        volumeMounts:
        - name: config-volume
          mountPath: /etc/alloy
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: alloy-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: varlogpods
        hostPath:
          path: /var/log/pods