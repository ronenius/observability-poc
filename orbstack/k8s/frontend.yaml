apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: observability-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        hec-token: "11111111-1111-1111-1111-111111111111"
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "true"
    spec:
      containers:
      - name: frontend
        image: your-registry/frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND1_URL
          value: "http://backend1:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: observability-poc
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: frontend