apiVersion: v1
kind: Namespace
metadata:
  name: holmes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: holmes
  namespace: holmes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: holmes-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
      - events
      - namespaces
      - nodes
      - resourcequotas
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagers
      - prometheuses
      - servicemonitors
      - podmonitors
      - prometheusrules
      - scrapeconfigs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: holmes-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: holmes-cluster-role
subjects:
  - kind: ServiceAccount
    name: holmes
    namespace: holmes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: holmes-config
  namespace: holmes
data:
  config.yaml: |
    model: "gemini/gemini-3.5-flash-lite"
    max_steps: 10
    alertmanager_url: "http://prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093"
    toolsets:
      kubernetes/core:
        enabled: true
      prometheus/metrics:
        enabled: true
        subtype: "prometheus"
        config:
          prometheus_url: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
      grafana/dashboards:
        enabled: true
        config:
          api_url: "http://prometheus-stack-grafana.monitoring.svc.cluster.local:80"
          username: "admin"
          password: "9oCV8ish5xVlGx1Kl4K8kTn3CJIb34QGad2B6Dc3"
      grafana/loki:
        enabled: true
        config:
          api_url: "http://loki-gateway.monitoring.svc.cluster.local"
          additional_headers:
            X-Scope-OrgID: "demo_app"
      grafana/tempo:
        enabled: true
        config:
          api_url: "http://tempo.monitoring.svc.cluster.local:3200"
          additional_headers:
            X-Scope-OrgID: "demo_app"
    custom_toolsets:
      - "/var/holmes/config/splunk_toolset.yaml"

  model_list.yaml: |
    gemini/gemini-3-flash:
      model: "gemini/gemini-3-flash-preview"
    gemini/gemini-3-flash-preview:
      model: "gemini/gemini-3-flash-preview"
    gemini/gemini-3.5-flash-lite:
      model: "gemini/gemini-3.5-flash-lite"
    gemini/gemini-3.6-flash:
      model: "gemini/gemini-3.6-flash"
    gemini/gemini-3.7-flash:
      model: "gemini/gemini-3.7-flash"
    gemini/gemini-3.8-flash:
      model: "gemini/gemini-3.8-flash"

  splunk_search.py: |
    #!/usr/bin/env python3
    import sys, os, urllib.request, urllib.parse, urllib.error, ssl, base64, json

    raw_query = sys.argv[1].strip() if len(sys.argv) > 1 else ""
    earliest = sys.argv[2] if len(sys.argv) > 2 else "-1h"
    latest = sys.argv[3] if len(sys.argv) > 3 else "now"

    while (raw_query.startswith("\x27") and raw_query.endswith("\x27")) or (raw_query.startswith("\"") and raw_query.endswith("\"")):
        raw_query = raw_query[1:-1].strip()

    if raw_query.lower().startswith("search "):
        raw_query = raw_query[7:].strip()

    if "index=" not in raw_query and not raw_query.startswith("|"):
        raw_query = f"index=* ({raw_query})" if raw_query else "index=*"

    if "|" not in raw_query:
        raw_query = f"{raw_query} | head 50"

    search_prefix = "" if raw_query.startswith("|") else "search "
    final_query = f"{search_prefix}{raw_query}"

    user = os.environ.get("SPLUNK_USER", "admin")
    password = os.environ.get("SPLUNK_PASSWORD", "Admin@123456")
    url = "https://splunk.splunk.svc.cluster.local:8089/services/search/jobs/export"

    data = urllib.parse.urlencode({
        "search": final_query,
        "output_mode": "json",
        "earliest_time": earliest,
        "latest_time": latest
    }).encode("utf-8")

    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE

    req = urllib.request.Request(url, data=data)
    auth = base64.b64encode(f"{user}:{password}".encode()).decode()
    req.add_header("Authorization", f"Basic {auth}")

    try:
        with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
            raw_output = resp.read().decode("utf-8", errors="replace").strip()
            lines = raw_output.splitlines()
            results = []
            for line in lines:
                try:
                    obj = json.loads(line)
                    if not obj.get("preview", False) and "result" in obj:
                        results.append(obj["result"])
                except:
                    pass
            if results:
                print(json.dumps(results, indent=2))
            elif lines:
                print(raw_output)
            else:
                print("No events found.")
    except urllib.error.HTTPError as e:
        err_body = e.read().decode("utf-8", errors="replace")
        print(f"Splunk API HTTP Error {e.code}: {err_body}")
    except Exception as e:
        print(f"Error querying Splunk: {e}")

  splunk_toolset.yaml: |
    toolsets:
      splunk:
        description: "Search and retrieve logs from Splunk Enterprise using SPL queries"
        prerequisites:
          - command: "python3 --version"
        tags:
          - core
        tools:
          - name: splunk_search
            description: "Execute a Splunk SPL search query and return matching log events in JSON format. Application logs are stored in 'frontend', 'backend1', and 'backend2' indices. Example: 'index=* | stats count' or 'index=* error | head 50'."
            parameters:
              splunk_query:
                type: string
                description: "The Splunk search SPL query. Examples: 'index=* | stats count', 'index=backend* error | head 20', 'index=* | stats count by index'"
                required: true
              earliest:
                type: string
                description: "Earliest time for search (e.g. '-15m', '-1h', '-24h'). Defaults to '-1h'."
                required: false
              latest:
                type: string
                description: "Latest time for search (e.g. 'now'). Defaults to 'now'."
                required: false
            command: |
              python3 /var/holmes/config/splunk_search.py "{{ splunk_query }}" "{{ earliest | default('-1h') }}" "{{ latest | default('now') }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes
  namespace: holmes
  labels:
    app: holmes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes
  template:
    metadata:
      labels:
        app: holmes
    spec:
      enableServiceLinks: false
      serviceAccountName: holmes
      containers:
        - name: holmes
          image: us-central1-docker.pkg.dev/genuine-flight-317411/devel/holmes:latest
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              python3 -c 'import re; p="/app/holmes/core/models.py"; f=open(p,"r"); s=f.read(); f.close(); s=re.sub(r"if not first_item\.get\([\"\x27]role[\"\x27]\) == [\"\x27]system[\"\x27]:\s+raise ValueError\([^\)]+\)", "if not first_item.get(\"role\") == \"system\":\n                conversation_history.insert(0, {\"role\": \"system\", \"content\": \"\"})", s); f=open(p,"w"); f.write(s); f.close(); p2="/app/holmes/core/llm.py"; f=open(p2,"r"); s2=f.read(); f.close(); s2=s2.replace("logging.error(f\"Couldn'\''t find model: {model_key} in model list\")", "if \"/\" in model_key:\n                tm = \"gemini/gemini-3-flash-preview\" if model_key == \"gemini/gemini-3-flash\" else model_key\n                entry = self._create_model_entry(model=tm, model_name=model_key, base_url=self.config.api_base, is_robusta_model=False, api_key=self.config.api_key, api_version=self.config.api_version)\n                with self._lock: self._llms[model_key] = entry\n                return entry\n            logging.error(f\"Couldn'\''t find model: {model_key} in model list\")"); f=open(p2,"w"); f.write(s2); f.close()' && mkdir -p /var/holmes/config && cp -L /etc/holmes/config-ro/* /var/holmes/config/ && exec python3 -u server.py
          ports:
            - name: http
              containerPort: 5050
          env:
            - name: HOLMES_PORT
              value: "5050"
            - name: HOLMES_CONFIGPATH_DIR
              value: "/var/holmes/config"
            - name: OVERRIDE_MAX_CONTENT_SIZE
              value: "150000"
            - name: OVERRIDE_MAX_OUTPUT_TOKEN
              value: "4096"
            - name: TOOL_MAX_ALLOCATED_CONTEXT_WINDOW_TOKENS
              value: "10000"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: SPLUNK_USER
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: SPLUNK_USER
            - name: SPLUNK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: holmes-secrets
                  key: SPLUNK_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config-ro-volume
              mountPath: /etc/holmes/config-ro
              readOnly: true
            - name: runtime-volume
              mountPath: /var/holmes
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: config-ro-volume
          configMap:
            name: holmes-config
        - name: runtime-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: holmes
  namespace: holmes
  labels:
    app: holmes
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 5050
      targetPort: 5050
      protocol: TCP
  selector:
    app: holmes
